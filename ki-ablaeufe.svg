<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Illustration: Ein Chatfenster ist über eine Steckverbindung mit Dokumenten und einer Datenbank verbunden">
  <!-- Chatfenster -->
  <rect x="20" y="40" width="120" height="110" rx="14" fill="#fbf8f3" stroke="#7a5233" stroke-width="2"/>
  <rect x="20" y="40" width="120" height="22" rx="14" fill="#c9a27e"/><rect x="20" y="52" width="120" height="10" fill="#c9a27e"/>
  <circle cx="34" cy="51" r="3.5" fill="#7a5233"/><circle cx="46" cy="51" r="3.5" fill="#7a5233"/>
  <rect x="34" y="74" width="68" height="20" rx="10" fill="#ebe4f6"/>
  <rect x="58" y="102" width="70" height="20" rx="10" fill="#cdbfea"/>
  <rect x="34" y="130" width="50" height="8" rx="4" fill="#d9cdbd"/>
  <!-- Stecker -->
  <path d="M140 95 H168" stroke="#7a5233" stroke-width="4" stroke-linecap="round"/>
  <rect x="166" y="80" width="30" height="30" rx="8" fill="#7b64b4"/>
  <path d="M196 88 h12 M196 102 h12" stroke="#7b64b4" stroke-width="4" stroke-linecap="round"/>
  <!-- Verzweigung -->
  <path d="M212 95 C232 95 230 60 250 60 M212 95 H250 M212 95 C232 95 230 132 250 132" stroke="#55684a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Ziele: Dokument, Datenbank, Messkurve -->
  <rect x="250" y="40" width="50" height="40" rx="8" fill="#fbf8f3" stroke="#7a5233" stroke-width="2"/>
  <rect x="260" y="52" width="30" height="4" rx="2" fill="#d9cdbd"/><rect x="260" y="62" width="22" height="4" rx="2" fill="#d9cdbd"/>
  <g transform="translate(250 82)"><ellipse cx="25" cy="6" rx="22" ry="6" fill="#c9a27e" stroke="#7a5233" stroke-width="2"/>
    <path d="M3 6 v14 a22 6 0 0 0 44 0 v-14" fill="#c9a27e" stroke="#7a5233" stroke-width="2"/>
    <path d="M3 13 a22 6 0 0 0 44 0" stroke="#7a5233" stroke-width="1.5" fill="none"/></g>
  <rect x="250" y="116" width="50" height="34" rx="8" fill="#fbf8f3" stroke="#7a5233" stroke-width="2"/>
  <path d="M258 138 l8 -10 l8 6 l8 -12 l10 6" stroke="#55684a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blätterzweig -->
  <path d="M30 182 C80 168 130 176 170 166" stroke="#55684a" stroke-width="2" fill="none"/>
  <g fill="#a9b89a"><ellipse cx="62" cy="170" rx="12" ry="5" transform="rotate(-25 62 170)"/><ellipse cx="100" cy="178" rx="12" ry="5" transform="rotate(20 100 178)"/><ellipse cx="138" cy="166" rx="12" ry="5" transform="rotate(-20 138 166)"/></g>
</svg>
